services:
  db:
    image: postgres:15
    container_name: odoo_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - odoo_db_data:/var/lib/postgresql/data
    networks:
      - mcp_network

  odoo:
    image: odoo:17.0
    container_name: odoo_app
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: ${POSTGRES_USER}
      PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - odoo_web_data:/var/lib/odoo
      - ./odoo/addons:/mnt/extra-addons
    networks:
      - mcp_network

  mcp-server:
    build: ./mcp-server
    container_name: mcp_server
    restart: unless-stopped
    depends_on:
      - odoo
    ports:
      - "8000:8000"
    env_file:
      - ./mcp-server/.env
    volumes:
      - ./mcp-server/reportes_generados:/app/reportes_generados
      - ./mcp-server/logs:/app/logs
      - ./mcp-server/credentials.json:/app/credentials.json
      - ./mcp-server/token.json:/app/token.json
    networks:
      - mcp_network
    stdin_open: true
    tty: true

  webapp:
    build: ./webapp
    container_name: webapp
    restart: unless-stopped
    depends_on:
      - mcp-server
    ports:
      - "5000:5000"
    env_file:
      - ./webapp/.env
    networks:
      - mcp_network

volumes:
  odoo_db_data:
  odoo_web_data:

networks:
  mcp_network:
    driver: bridge